<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">agent-prototype-studio</title>
  <desc id="desc">思いつきを AI プロダクトにすると、どんな作りになるか。動かして測り、人が承認してから作る。 See how your idea works as an AI product, test it, and approve the architecture before you build.</desc>
  <rect width="1280" height="640" fill="#161614"/>
  <g font-family="system-ui, -apple-system, &quot;Hiragino Sans&quot;, &quot;Yu Gothic UI&quot;, &quot;Noto Sans JP&quot;, sans-serif">
    <g transform="translate(80 84)">
