      <rect x="0" y="11" width="30" height="8" rx="3" fill="#4cc184"/>
      <rect x="0" y="22" width="30" height="8" rx="3" fill="#f97066"/>
      <text x="46" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#ecece8">agent-prototype-studio</text>
    </g>
    <text x="80" y="218" font-size="38" font-weight="700" fill="#ecece8">思いつきを AI プロダクトにすると、</text>
    <text x="80" y="274" font-size="38" font-weight="700" fill="#ecece8">どんな作りになるか。</text>
    <text x="80" y="330" font-size="38" font-weight="700" fill="#ecece8">動かして測り、人が承認してから作る。</text>
    <text x="80" y="398" font-size="22" fill="#a3a39c">See how your idea works as an AI product, test it,</text>
    <text x="80" y="430" font-size="22" fill="#a3a39c">and approve the architecture before you build.</text>
