      <rect x="0" y="22" width="30" height="8" rx="3" fill="#FF8A7A"/>
      <text x="46" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#E7E9EC">agent-prototype-studio</text>
    </g>
    <text x="80" y="218" font-size="38" font-weight="700" fill="#E7E9EC">思いつきを AI プロダクトにすると、</text>
    <text x="80" y="274" font-size="38" font-weight="700" fill="#E7E9EC">どんな作りになるか。</text>
    <text x="80" y="330" font-size="38" font-weight="700" fill="#E7E9EC">動かして測り、人が承認してから作る。</text>
    <text x="80" y="398" font-size="22" fill="#A2A9B1">See how your idea works as an AI product, test it,</text>
    <text x="80" y="430" font-size="22" fill="#A2A9B1">and approve the architecture before you build.</text>
