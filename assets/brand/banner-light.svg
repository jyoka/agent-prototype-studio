<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">agent-prototype-studio</title>
  <desc id="desc">AI エージェントの試作品を、作る前に、構成ごと手元で試して測る。 Try and measure an AI agent prototype, whole setup included, on your machine before you build it.</desc>
  <rect width="1280" height="640" fill="#f6f6f4"/>
