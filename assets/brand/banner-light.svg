      <rect x="0" y="0" width="8" height="52" rx="4" fill="#17703D"/>
      <text x="28" y="33" font-size="19" fill="#16181B">ツール(MCP)</text>
    </g>
    <g transform="translate(880 364)">
      <rect width="320" height="52" rx="8" fill="#FBEAE8" stroke="#B42318" stroke-width="2"/>
      <rect x="0" y="0" width="8" height="52" rx="4" fill="#B42318"/>
