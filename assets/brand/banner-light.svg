      <rect x="0" y="11" width="30" height="8" rx="3" fill="#17703D"/>
      <rect x="0" y="22" width="30" height="8" rx="3" fill="#B42318"/>
      <text x="46" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#16181B">agent-prototype-studio</text>
    </g>
    <text x="80" y="218" font-size="38" font-weight="700" fill="#16181B">思いつきを AI プロダクトにすると、</text>
    <text x="80" y="274" font-size="38" font-weight="700" fill="#16181B">どんな作りになるか。</text>
    <text x="80" y="330" font-size="38" font-weight="700" fill="#16181B">動かして測り、人が承認してから作る。</text>
    <text x="80" y="398" font-size="22" fill="#535960">See how your idea works as an AI product, test it,</text>
    <text x="80" y="430" font-size="22" fill="#535960">and approve the architecture before you build.</text>
    <path d="M 864 118 V 570" stroke="#DADDE1" stroke-width="2" stroke-dasharray="4 6"/>
