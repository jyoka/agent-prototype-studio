<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>その場の共有 - Prototype Studio</title>
  <link rel="stylesheet" href="/s/share.css">
  <script type="module" src="/s/share.js"></script>
</head>
<body>
  <header class="share-head">
    <h1 id="share-title">その場の共有</h1>
    <p id="share-who" class="muted"></p>
    <p id="share-status" class="share-status" role="status" data-state="connecting">中継のサーバーにつないでいます…</p>
  </header>
  <p id="share-gone" class="share-gone" role="alert" hidden></p>
  <main id="share-main" hidden>
    <p id="share-viewer" class="muted" hidden>見るだけの役です。文書を読めますが、直すことはできません。</p>
    <p id="share-error" class="share-error" role="alert" hidden></p>
    <section class="share-section" aria-labelledby="share-board-heading">
      <h2 id="share-board-heading">整理の板</h2>
      <p class="muted">項目を足す、直す、消すことができます。進行役の Studio が受け取ると、みんなの画面に出ます。</p>
      <div id="share-columns" class="share-columns"></div>
      <form id="share-add" class="share-line" hidden>
        <label for="share-add-column">欄</label>
        <select id="share-add-column"></select>
        <label for="share-add-text">足す項目</label>
        <input id="share-add-text" type="text" maxlength="300" autocomplete="off">
        <button type="submit">足す</button>
      </form>
      <h3>聞くこと</h3>
      <ul id="share-asks" class="share-list" aria-label="聞くことの一覧"></ul>
    </section>
    <section class="share-section" aria-labelledby="share-requirements-heading">
      <h2 id="share-requirements-heading">要件の文書</h2>
      <p class="muted">進行役の Studio が、整理の板と目的の文書から作った写しです。直したいことは整理の板で直します。</p>
      <div id="share-requirements"></div>
    </section>
    <section class="share-section" aria-labelledby="share-data-heading">
      <h2 id="share-data-heading">データ設計</h2>
      <div id="share-data"></div>
    </section>
    <section class="share-section" aria-labelledby="share-scenes-heading">
      <h2 id="share-scenes-heading">場面の一覧</h2>
      <ul id="share-scenes" class="share-list"></ul>
    </section>
    <section class="share-section" aria-labelledby="share-open-heading">
      <h2 id="share-open-heading">未決事項</h2>
      <ul id="share-open" class="share-list"></ul>
    </section>
  </main>
</body>
</html>
